<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Sachin Lolariya — Website Developer</title>
  <desc id="desc">A cinematic dark navy and electric blue developer banner with subtle grid lines and glowing accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/><stop offset="0.58" stop-color="#0A1730"/><stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#38BDF8" stop-opacity=".28"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#60A5FA" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <circle cx="960" cy="130" r="220" fill="url(#orb)"/>
  <circle cx="960" cy="130" r="120" fill="none" stroke="#38BDF8" stroke-opacity=".18"/>
  <circle cx="960" cy="130" r="164" fill="none" stroke="#60A5FA" stroke-opacity=".13" stroke-dasharray="4 12"/>
  <path d="M760 270C850 220 875 70 1000 80S1120 170 1200 95" fill="none" stroke="#38BDF8" stroke-opacity=".45" stroke-width="2"/>
  <path d="M760 270C850 220 875 70 1000 80S1120 170 1200 95" fill="none" stroke="#38BDF8" stroke-opacity=".35" stroke-width="10" filter="url(#blur)"/>
  <path d="M0 285H1200" stroke="url(#glow)" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="76" y="76" fill="#7DD3FC" font-size="14" letter-spacing="5">WEB DEVELOPMENT / WORDPRESS</text>
    <text x="72" y="158" fill="#F8FAFC" font-size="58" font-weight="700" letter-spacing="-1">SACHIN LOLARIYA</text>
    <text x="76" y="204" fill="#BFDBFE" font-size="23" letter-spacing="1.2">Website Developer  •  WordPress Developer</text>
    <text x="76" y="250" fill="#94A3B8" font-size="15">Building responsive interfaces and dynamic web experiences.</text>
    <text x="1090" y="292" fill="#7DD3FC" font-size="12" text-anchor="end" letter-spacing="3">BUILD / LEARN / IMPROVE</text>
  </g>
  <circle cx="1100" cy="70" r="4" fill="#7DD3FC"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="230" r="3" fill="#60A5FA"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
