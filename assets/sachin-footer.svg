<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Sachin Lolariya — Keep Building. Keep Learning.</title>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <!-- Top Static Base Line -->
    <linearGradient id="sf-line-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0.2"/>
    </linearGradient>

    <!-- High-Visibility Laser Shimmer Beam -->
    <linearGradient id="sf-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="35%" stop-color="#C77B9B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#E5B5C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="sf-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#C77B9B" stroke-opacity="0.06" stroke-width="0.8"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="110" rx="12" fill="url(#sf-bg)"/>
  <rect width="1200" height="110" rx="12" fill="url(#sf-grid)"/>

  <!-- Top Static Guide Line -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#sf-line-base)" stroke-width="1.5"/>

  <!-- Top Active Moving Light Beam -->
  <g>
    <rect x="-250" y="0" width="250" height="2.5" fill="url(#sf-beam)">
      <animate attributeName="x" values="-250;1200" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Left Animated Accent Nodes -->
  <g transform="translate(180, 55)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1"/>
    
    <!-- Spinning Dashed Ring (Clockwise, 5s) -->
    <g>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#C77B9B" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 6"/>
      <circle cx="13" cy="0" r="2.5" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Pulsing Center Core -->
    <circle cx="0" cy="0" r="3.5" fill="#E5B5C7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center Typography & Pulsing Signal Indicators -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- Center Live Pulse Beacons -->
    <circle cx="340" cy="48" r="3" fill="#E5B5C7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="52" fill="#F8F0F3" font-size="14" font-weight="600" letter-spacing="4.5">DESIGN WITH INTENTION  •  BUILD WITH CARE</text>

    <circle cx="860" cy="48" r="3" fill="#E5B5C7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="75" fill="#C77B9B" font-size="11" font-weight="400" letter-spacing="2">SACHIN LOLARIYA  //  WEB DEVELOPER &amp; WEB DESIGNER</text>
  </g>

  <!-- Right Animated Accent Nodes -->
  <g transform="translate(1020, 55)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1"/>

    <!-- Spinning Dashed Ring (Counter-Clockwise, 5s) -->
    <g>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#C77B9B" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 6"/>
      <circle cx="-13" cy="0" r="2.5" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Pulsing Center Core -->
    <circle cx="0" cy="0" r="3.5" fill="#E5B5C7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
