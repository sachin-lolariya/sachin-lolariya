<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Sachin Lolariya — Keep Building. Keep Learning.</title>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <!-- Glowing Top Accent Line -->
    <linearGradient id="sf-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C77B9B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="sf-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#C77B9B" stroke-opacity="0.05" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="110" rx="12" fill="url(#sf-bg)"/>
  <rect width="1200" height="110" rx="12" fill="url(#sf-grid)"/>

  <!-- Top Accent Glowing Rule -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#sf-glow-line)"/>

  <!-- Left Accent Nodes -->
  <g transform="translate(180, 55)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#701A3D" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="#E5B5C7"/>
  </g>

  <!-- Center Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="52" fill="#F8F0F3" font-size="14" font-weight="600" letter-spacing="4.5">DESIGN WITH INTENTION  •  BUILD WITH CARE</text>
    <text x="600" y="74" fill="#C77B9B" font-size="11" font-weight="400" letter-spacing="2">SACHIN LOLARIYA  //  WEB DEVELOPER &amp; WEB DESIGNER</text>
  </g>

  <!-- Right Accent Nodes -->
  <g transform="translate(1020, 55)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#701A3D" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="#E5B5C7"/>
  </g>
</svg>
